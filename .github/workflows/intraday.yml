name: 0050 Intraday Auto Monitor

on:
  push:
    branches: [main]
    paths:
      - 'run_intraday.py'
      - '.github/workflows/intraday.yml'
  workflow_dispatch:
  schedule:
    # Run a couple of minutes after each 5-minute bar boundary to reduce
    # top-of-hour scheduling congestion. 01:02-05:57 UTC maps to
    # 09:02-13:57 Taiwan time; each run publishes the latest available bar(s).
    - cron: "2-57/5 1-5 * * 1-5"
    # Taiwan evening futures monitor before the US cash session.
    - cron: "*/15 7-13 * * 0-5"
    # Refresh US cash-session indices and ADRs every five minutes (UTC; covers pre-open through close in winter/summer).
    - cron: "*/5 14-21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: etf-0050-intraday
  # Do not cancel an active data fetch/commit when the next 5-minute tick arrives.
  cancel-in-progress: false

jobs:
  refresh-intraday:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install intraday data dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pandas>=2.2,<3" "yfinance>=0.2.40"

      - name: Validate and fetch five-minute market data
        run: |
          python -m py_compile run_intraday.py
          python run_intraday.py

      - name: Commit intraday snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/intraday.json
          if git diff --cached --quiet; then
            echo "Intraday snapshot did not change."
          else
            git commit -m "chore: refresh 0050 intraday snapshot"
            git fetch origin main
            git rebase origin/main
            git push
          fi

