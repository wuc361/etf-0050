<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="0050 盤中五分鐘行情監控">
<title>0050 盤中即時監控</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{margin:0;background:#0b1220;color:#e5e7eb}main{max-width:1050px;margin:auto;padding:24px 16px 50px}
a{color:#93c5fd}.muted{color:#9ca3af}.status{display:inline-block;padding:6px 11px;border-radius:999px;background:#25364d}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:16px 0}
.card{background:#151f32;border:1px solid #29364c;border-radius:14px;padding:16px}
.label{color:#9ca3af;font-size:.9rem}.value{font-size:1.65rem;font-weight:750;margin-top:7px}
.up{color:#f87171}.down{color:#34d399}.neutral{color:#cbd5e1}
canvas{display:block;width:100%;height:320px;background:#101a2b;border-radius:10px}
#chart{height:320px} .chart-caption{font-size:.85rem;color:#9ca3af;line-height:1.6}
small{color:#9ca3af;line-height:1.6}

</style></head>
<body><main>
<nav aria-label="0050 功能分頁" style="display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px">
<a href="./index.html#prediction" target="_top" style="padding:8px 12px;border:1px solid #475569;border-radius:9px;text-decoration:none">📈 預測</a>
<a href="./index.html#realtime" target="_top" aria-current="page" style="padding:8px 12px;border:1px solid #60a5fa;border-radius:9px;background:#1d4ed8;color:#fff;text-decoration:none">📡 即時</a>
<a href="./index.html#research" target="_top" style="padding:8px 12px;border:1px solid #475569;border-radius:9px;text-decoration:none">📰 新聞與技術</a>
</nav>
<h1>📡 0050 盤中即時監控</h1>
<p id="status" class="status">載入中…</p>
<p id="updated" class="muted">等待行情資料</p>
<div class="grid">
 <article class="card"><div class="label">0050 最新 5 分鐘報價</div><div id="price" class="value">—</div><p id="change" class="muted">—</p></article>
 <article class="card"><div class="label">相對前一交易日收盤</div><div id="day-change" class="value">—</div><p id="prev-close" class="muted">—</p></article>
 <article class="card"><div class="label">當日區間</div><div id="range" class="value">—</div><p id="volume" class="muted">—</p></article>
 
</div>
<section class="card"><h2>0050 今日 5 分鐘走勢</h2><p id="chart-session" class="chart-caption">台灣時間｜日期與每個時間刻度將顯示於圖表下方</p><canvas id="chart" width="1000" height="320" aria-label="0050今日五分鐘走勢，橫軸為台灣時間"></canvas><p id="chart-note" class="muted">—</p></section>

<p class="muted"><a href="./index.html">返回每日預測與歷史 K 線</a></p>
</main>
<script>
(async function(){
 const $=id=>document.getElementById(id);
 const fmt=(v,d=2)=>v==null||!Number.isFinite(Number(v))?"—":Number(v).toLocaleString("zh-TW",{minimumFractionDigits:d,maximumFractionDigits:d});
 const pct=v=>v==null?"—":(v>0?"+":"")+fmt(v,2)+"%";
 const cls=v=>v==null?"neutral":v>0?"up":v<0?"down":"neutral";
 function draw(bars){
  const c=$("chart"),ctx=c.getContext("2d"),w=1000,h=320;
  c.width=w;c.height=h;ctx.clearRect(0,0,w,h);
  if(!bars||!bars.length){ctx.fillStyle="#9ca3af";ctx.font="14px sans-serif";ctx.fillText("尚無今日 0050 5 分鐘資料",20,35);return}
  const points=bars.filter(x=>Number.isFinite(Number(x.close)));
  if(!points.length){ctx.fillStyle="#9ca3af";ctx.font="14px sans-serif";ctx.fillText("尚無有效的今日 0050 5 分鐘資料",20,35);return}
  const values=points.map(x=>Number(x.close)),lo=Math.min(...values),hi=Math.max(...values),pad=(hi-lo)*.12||.1;
  const left=58,right=18,top=18,bottom=48;
  const x=i=>points.length===1?(left+w-right)/2:left+i*(w-left-right)/(points.length-1);
  const y=v=>top+(hi+pad-v)*(h-top-bottom)/(hi-lo+2*pad);
  ctx.font="12px sans-serif";ctx.textAlign="right";ctx.textBaseline="middle";
  for(let i=0;i<5;i++){const yy=top+i*(h-top-bottom)/4;ctx.strokeStyle="#34445d";ctx.beginPath();ctx.moveTo(left,yy);ctx.lineTo(w-right,yy);ctx.stroke();const val=hi+pad-i*(hi-lo+2*pad)/4;ctx.fillStyle="#9ca3af";ctx.fillText(fmt(val),left-8,yy);}
  ctx.strokeStyle="#60a5fa";ctx.lineWidth=2;ctx.beginPath();
  values.forEach((v,i)=>i?ctx.lineTo(x(i),y(v)):ctx.moveTo(x(i),y(v)));ctx.stroke();
  ctx.fillStyle="#f8fafc";ctx.beginPath();ctx.arc(x(points.length-1),y(values[values.length-1]),4,0,Math.PI*2);ctx.fill();
  ctx.textAlign="center";ctx.textBaseline="top";ctx.fillStyle="#9ca3af";
  const ticks=Math.min(7,points.length);
  for(let k=0;k<ticks;k++){const i=Math.round(k*(points.length-1)/(ticks-1||1));const time=String(points[i].time||"").slice(11,16);ctx.fillText(time,x(i),h-bottom+12);}
  $("chart-session").textContent="交易日期："+String(points[0].time||"").slice(0,10)+"｜台灣時間（UTC+8）｜每根K線代表5分鐘";
  $("chart-note").textContent="最新一根："+String(points[points.length-1].time||"—").replace("T"," ")+"｜收盤 "+fmt(values[values.length-1])+" 元";
 }

 async function load(){
  try{
   const a=await fetch("./data/intraday.json?ts="+Date.now(),{cache:"no-store"});
   if(!a.ok)throw new Error("盤中資料尚未發布");const live=await a.json();
   $("status").textContent=live.label||live.status;const twQuote=(live.quotes||[]).find(x=>x.ticker==="0050.TW");$("updated").textContent="0050 交易日期："+((twQuote&&twQuote.market_date_taipei)||"—")+"｜最新K線時間："+((twQuote&&twQuote.latest_bar_time)||"—")+"｜最後抓取："+(live.generated_at_taipei||"—")+"｜更新目標：每5分鐘";
   const etf=(live.quotes||[]).find(x=>x.ticker==="0050.TW");
   if(etf&&etf.price!=null){
    $("price").textContent=fmt(etf.price);$("change").textContent="最近一根5分鐘K："+pct(etf.five_min_change_pct);$("change").className=cls(etf.five_min_change_pct);
    $("day-change").textContent=pct(etf.change_pct);$("day-change").className=cls(etf.change_pct);
    $("prev-close").textContent="前一交易日收盤："+fmt(etf.previous_close);
    $("range").textContent=fmt(etf.low)+" – "+fmt(etf.high);$("volume").textContent="當日累計成交量："+(etf.volume==null?"—":Number(etf.volume).toLocaleString("zh-TW"));
    draw(etf.bars||[]);$("chart-note").textContent="最新行情時間："+(etf.latest_bar_time||"—");
   }else{$("chart-note").textContent="目前沒有可用的0050價格；若供應商暫時中斷，系統會優先保留上次成功資料並標示實際時間。"}
  }catch(e){$("status").textContent="資料載入失敗";$("updated").textContent=e.message}
 }
 await load();setInterval(load,60000);
})();
</script></body></html>
